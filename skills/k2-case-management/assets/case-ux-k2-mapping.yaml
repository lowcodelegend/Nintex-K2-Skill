{
  "schema_version": 1,
  "application": {"name":"{{CODE}}.Case Experience","rootCategoryPath":"K2 Skills\\{{CODE}}.Case","solutionCode":"{{CODE}}","theme":"Lithium","styleProfile":"{{STYLE_PROFILE}}"},
  "homepage": {
    "page":"operations-dashboard",
    "implementation":"native-smartforms",
    "navigation":{
      "viewName":"{{CODE}}.Application Navigation",
      "smartObject":"{{NAVIGATION_SMARTOBJECT}}",
      "properties":["NavigationCode","SectionLabel","Label","IconToken","TargetFormName","SortOrder","IsActive","ConfigurationVersion"]
    },
    "commandPalette":{
      "viewName":"{{CODE}}.Command Palette",
      "smartObject":"{{COMMAND_SUGGESTION_SMARTOBJECT}}",
      "properties":["SuggestionCode","Kind","Title","Subtitle","IconToken","TargetUrl","SortOrder","IsActive","ConfigurationVersion"],
      "controlName":"Northstar Command Palette",
      "controlType":"northstar-command-palette",
      "controlPackage":"assets/northstar-command-palette",
      "listMethod":"List",
      "listDataProperty":"Suggestions",
      "propertiesMap":{
      "Value":"",
      "Suggestions":"[]",
      "SearchUrlTemplate":"/Runtime/Runtime/Form/{{ALL_CASES_FORM}}?q={query}",
      "Placeholder":"Search cases, work and reports",
      "Width":"100%",
      "Height":"48px",
      "TagName":"northstar-command-palette",
      "RuntimeScriptFileNames":"northstar-command-runtime.js",
      "DesigntimeScriptFileNames":"northstar-command-designtime.js",
      "RuntimeStyleFileNames":"northstar-command-runtime.css",
      "DesigntimeStyleFileNames":"northstar-command-designtime.css",
      "Icon":"northstar-command-icon.svg"
      }
    }
  },
  "dashboard": {
    "page":"operations-dashboard","formName":"{{CODE}}.Quality Operations",
    "summary":{"viewName":"{{CODE}}.Operations KPIs","smartObject":"{{SUMMARY_SMARTOBJECT}}","components":[{"id":"open-cases","property":"OpenCaseCount"}]},
    "charts":[{"component":"cases-by-stage","viewName":"{{CODE}}.Cases by Stage","smartObject":"{{STAGE_METRICS_SMARTOBJECT}}","categoryProperty":"StageLabel","valueProperty":"CaseCount"}],
    "queues":[{"component":"urgent-work","viewName":"{{CODE}}.Urgent Work","smartObject":"{{URGENT_WORK_SMARTOBJECT}}","properties":["CaseId","CaseNumber","Title"]}]
  },
  "myWork": {
    "formName":"{{CODE}}.My Work",
    "worklistTab":"My Tasks",
    "worklist":{"rows":20,"refreshIntervalSeconds":120,"showToolbar":true,"showFilter":true,"showSearch":false,"enableSearch":true,"height":"445px","openTaskInNewWindow":true,"actions":["viewWorkflow","sleep","redirect","release","share"]},
    "queues":[{"tab":"Urgent Team Work","viewName":"{{CODE}}.Urgent Work","title":"Urgent cases needing attention"}]
  },
  "workspace": {
    "viewName":"{{CODE}}.Case Workspace",
    "shellFormName":"{{CODE}}.Case Management",
    "workspaceTab":"Case Workspace",
    "sectionTabs":[
      {"name":"Overview","views":["{{CODE}}.Case Workspace","{{CODE}}.Commands","{{CODE}}.Case Detail","{{CODE}}.Parties"]},
      {"name":"Investigation","views":["{{CODE}}.Evidence","{{CODE}}.AI Interactions"]},
      {"name":"Collaboration","views":["{{CODE}}.Communications","{{CODE}}.Comments"]},
      {"name":"Decisions & Actions","views":["{{CODE}}.Decisions","{{CODE}}.Corrective Actions"]},
      {"name":"Activity & History","views":["{{CODE}}.Case Tasks","{{CODE}}.Stage History"]}
    ],
    "analyticsTab":"Analytics",
    "lifecycleComponent":"case-lifecycle",
    "title":"Case Lifecycle",
    "currentStageProperty":"CurrentStageCode",
    "stages":[
      {"code":"CAPTURE","label":"Capture"},
      {"code":"VALIDATE","label":"Validate"},
      {"code":"CLASSIFY","label":"Classify & Prioritise"},
      {"code":"ASSIGN","label":"Assign & Route"},
      {"code":"INVESTIGATE","label":"Investigate or Fulfil"},
      {"code":"DECIDE","label":"Review & Decide"},
      {"code":"RESOLVE","label":"Resolve & Communicate"},
      {"code":"CLOSE","label":"Close & Learn"}
    ]
  },
  "agenticChat": {
    "enabled": false,
    "integration": "command-palette",
    "viewName": "{{CODE}}.Case Assistant Palette",
    "sourcePaletteViewName": "{{CODE}}.Command Palette",
    "controlName": "Northstar Case Assistant",
    "controlPackage": "assets/northstar-command-palette",
    "hostUrl": "https://{{LANGFLOW_HOST}}",
    "flowId": "{{LANGFLOW_FLOW_ID}}",
    "scriptUrl": "https://cdn.jsdelivr.net/gh/langflow-ai/langflow-embedded-chat@v1.0.8/dist/build/static/js/bundle.min.js",
    "windowTitle": "Case Assistant",
    "label": "Ask Case Assistant",
    "description": "Ask questions and take supported case actions",
    "chatPosition": "bottom-right",
    "width": 420,
    "height": 640,
    "placement": {
      "formName": "{{CODE}}.Case Management",
      "tab": "Overview"
    }
  },
  "reports": {
    "formName":"{{CODE}}.Reports",
    "shellTab":"Reports",
    "views":[
      {"group":"Operations","viewName":"{{CODE}}.Backlog Aging","title":"Backlog and aging","smartObject":"{{REPORT_AGING_SMARTOBJECT}}","categoryProperty":"AgingBucket","valueProperty":"CaseCount","type":"column"},
      {"group":"Operations","viewName":"{{CODE}}.SLA Performance","title":"SLA performance","smartObject":"{{REPORT_SLA_SMARTOBJECT}}","categoryProperty":"SLAStatus","valueProperty":"CaseCount","type":"donut","showLegend":true},
      {"group":"Performance","viewName":"{{CODE}}.Closure Throughput","title":"Closure throughput","smartObject":"{{REPORT_THROUGHPUT_SMARTOBJECT}}","categoryProperty":"PeriodLabel","valueProperty":"ClosedCaseCount","type":"line"},
      {"group":"Performance","viewName":"{{CODE}}.CAPA Effectiveness","title":"Corrective action status","smartObject":"{{REPORT_CAPA_SMARTOBJECT}}","categoryProperty":"ActionStatus","valueProperty":"ActionCount","type":"bar"},
      {"group":"Quality","viewName":"{{CODE}}.Case Outcomes","title":"Case outcomes","smartObject":"{{REPORT_OUTCOMES_SMARTOBJECT}}","categoryProperty":"OutcomeLabel","valueProperty":"CaseCount","type":"bar"},
      {"group":"Quality","viewName":"{{CODE}}.Recurrence","title":"Recurrence","smartObject":"{{REPORT_RECURRENCE_SMARTOBJECT}}","categoryProperty":"RecurrenceLabel","valueProperty":"CaseCount","type":"bar"}
    ]
  },
  "initiation": {
    "journey":"canonical-initiation",
    "guidedMode":"auto",
    "finalActionMode":"workflow",
    "journeyTitle":"New case",
    "journeyDescription":"Describe the case, add supporting evidence, then review and submit it.",
    "formName":"{{CODE}}.New Case",
    "masterView":"{{CODE}}.Case Workspace",
    "captureViewName":"{{CODE}}.New Case Details",
    "entryProperties":["Title","Description","Source","PriorityCode","SeverityCode","RiskCode","ConfidentialityCode"],
    "propertyLabels":{"PriorityCode":"Priority","SeverityCode":"Severity","RiskCode":"Risk","ConfidentialityCode":"Confidentiality"},
    "masterKeyProperty":"CaseId",
    "reviewViewName":"{{CODE}}.New Case Review",
    "smartObject":"{{CASE_SMARTOBJECT}}",
    "reviewProperties":["CaseId","CaseNumber","Title","Description","PriorityCode","TargetDate"],
    "detailsTab":"Case Details",
    "evidenceTab":"Evidence",
    "reviewTab":"Review & Submit",
    "stepTabs":[
      {"id":"incident","name":"Case Details","label":"Case details","description":"Describe what happened and provide the relevant case context.","views":["$master","{{CODE}}.Case Detail"]},
      {"id":"evidence","name":"Evidence","label":"Evidence","description":"Add the supporting records needed to understand the case.","views":["{{CODE}}.Evidence"]},
      {"id":"review","name":"Review & Submit","label":"Review","description":"Check the complete case before submitting it.","views":["$review"]}
    ],
    "saveButtonText":"Save draft and review",
    "submitButtonName":"btnSubmitCase",
    "submitButtonText":"Submit case",
    "details":[
      {"step":"details","view":"{{CODE}}.Case Detail","foreignKeyProperty":"CaseId"},
      {"step":"evidence","view":"{{CODE}}.Evidence","foreignKeyProperty":"CaseId"}
    ]
  },
  "runtimeBaseUrl":"https://k2.example.test/Runtime"
}
