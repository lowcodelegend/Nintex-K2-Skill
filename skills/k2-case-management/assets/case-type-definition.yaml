{
  "schema_version": 1,
  "case_type": {
    "code": "EVIDENCE_EXCEPTION",
    "name": "Evidence-Driven Exception Review",
    "description": "Use this case type to investigate a reported exception from an expected process, policy, control, or outcome when evidence must be gathered and a governed decision recorded.",
    "use_when": [
      "A process, policy, control, or expected outcome may have been breached or bypassed.",
      "The facts are incomplete or disputed and supporting evidence needs structured review.",
      "A traceable decision, accountable owner, and defensible closure record are required."
    ],
    "do_not_use_when": [
      "The request is routine service fulfilment with no exception, investigation, or adjudication.",
      "A confirmed quality defect should instead follow the organisation's nonconformance or CAPA case type.",
      "An immediate safety, security, or operational emergency requires the dedicated incident response route."
    ],
    "expected_outcome": "The exception is validated, investigated against the available evidence, decided by an accountable person, and closed with the rationale and resulting actions recorded.",
    "initial_stage": "CAPTURE",
    "retention_code": "QUALITY_RECORD",
    "configuration_version": "1",
    "ai_enabled": true
  },
  "stages": [
    {"code": "CAPTURE", "workflow": "CM.Stage.Capture", "sequence": 10, "exit_rule": "CAPTURE_COMPLETE", "terminal": false},
    {"code": "VALIDATE", "workflow": "CM.Stage.Validate", "sequence": 20, "exit_rule": "VALIDATION_COMPLETE", "terminal": false},
    {"code": "INVESTIGATE", "workflow": "CM.Stage.Investigate", "sequence": 30, "exit_rule": "EVIDENCE_COMPLETE", "terminal": false},
    {"code": "DECIDE", "workflow": "CM.Stage.Decide", "sequence": 40, "exit_rule": "DECISION_RECORDED", "terminal": false},
    {"code": "CLOSE", "workflow": "CM.Stage.Close", "sequence": 50, "exit_rule": "CLOSURE_COMPLETE", "terminal": true}
  ],
  "transitions": [
    {"from": "CAPTURE", "outcome": "SUBMITTED", "to": "VALIDATE"},
    {"from": "VALIDATE", "outcome": "VALID", "to": "INVESTIGATE"},
    {"from": "VALIDATE", "outcome": "MORE_INFORMATION_REQUIRED", "to": "CAPTURE", "reentry": true},
    {"from": "INVESTIGATE", "outcome": "EVIDENCE_COMPLETE", "to": "DECIDE"},
    {"from": "DECIDE", "outcome": "RETURNED_FOR_INVESTIGATION", "to": "INVESTIGATE", "reentry": true},
    {"from": "DECIDE", "outcome": "APPROVED", "to": "CLOSE"}
  ],
  "agentic_creation": {
    "enabled": true,
    "contract": "case-agent-creation-contract.yaml",
    "contract_version": 2,
    "creation_mode": "deferredMaterialization"
  },
  "extensions": {"entities": [], "notes": "Add solution-specific data; retain the canonical model in case-model.yaml."}
}
